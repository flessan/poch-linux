name: Windows builds

on:
  push:
    branches: [main, feat/linux-support]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows 10/11 backend
        run: cargo build --release
      - name: Test Windows target
        run: cargo test --release
